<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cartoon Character Card</title>

    <style>
    /*Body Selector:Sets the overall backround color*/
    body{
    background-color: whitesmoke;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    }
    /*Class Selector:Styles the character card box container*/
    .character-card{
    background-color:darkgreen ;
    border:4px solid #ffcc00;
    border-radius:20px;
    box-shadow:0 8px 16px rgba(0,0,0,0.2);
    padding: 25px;
    width: 300px;
    text-align: center;
    }
    /*Element Selector:Styles the heading text color and weight*/
    h1{
        color: aquamarine;
        font-weight: 800;/*Custom text weight*/
        margin-bottom: 5px;
    }
    /*Element Selector:Placehold style for the image*/
    img{
    width:150px;
    height:150px;
    border-radius:50%;
    border:3px solid #4caf50;
    object-fit:cover;
    }
    /*Element Sector:Default paragrah styles*/
    p{
    color:#333333;
    line-height:1.5;
    }
    </style>
</head>
<body>

<div class="character-card">

<h1>Spongebob</h1>

<div class="character-role">Fry Cook Extraodinare</div>

<img src="https://piscum.photos" alt="Cartoon Character Image">

<p>A cheerful,energetic, and optimistic sea sponge who lives in a pinapple under the sea and works at the Krusty Krab.</p>
<p style="color:#e91e63;font-weight: bold;font-size:1.1rem;">
"I'm ready! I'm ready"
</p>


</div>

</body>
</html>
